<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nico IA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            background-color: #1f1f1f;
            padding: 14px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 1px solid #2a2a2a;
            flex-shrink: 0;
        }

        #chat-container {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-msg {
            background-color: #007acc;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-msg {
            background-color: #262626;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        #input-container {
            background-color: #1f1f1f;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-top: 1px solid #2a2a2a;
            width: 100%;
            flex-shrink: 0;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            background-color: #2a2a2a;
            border: none;
            padding: 10px 12px;
            color: #ffffff;
            border-radius: 20px;
            outline: none;
            font-size: 0.95rem;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 4px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4da6ff;
        }

        #send-btn {
            color: #007acc;
            font-weight: bold;
        }

        .recording {
            color: #ff4444 !important;
        }

        .hidden-input {
            display: none;
        }
    </style>
</head>
<body>

    <header>Nico IA</header>

    <div id="chat-container">
        <div class="message bot-msg">¡Hola! Soy Nico IA. ¿En qué te puedo ayudar hoy?</div>
    </div>

    <div id="input-container">
        <!-- Cámara -->
        <button class="icon-btn" id="cam-btn" title="Cámara">📷</button>
        <!-- Adjuntar -->
        <button class="icon-btn" id="attach-btn" title="Adjuntar">📎</button>
        <!-- Micrófono -->
        <button class="icon-btn" id="mic-btn" title="Dictar">🎙️</button>
        
        <input type="text" id="user-input" placeholder="Escribí un mensaje..." />
        
        <!-- Enviar -->
        <button class="icon-btn" id="send-btn" title="Enviar">➔</button>
    </div>

    <input type="file" id="camera-file-input" class="hidden-input" accept="image/*" capture="environment">
    <input type="file" id="attach-file-input" class="hidden-input" accept="*/*">

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const camBtn = document.getElementById('cam-btn');
        const attachBtn = document.getElementById('attach-btn');
        const micBtn = document.getElementById('mic-btn');
        const cameraFileInput = document.getElementById('camera-file-input');
        const attachFileInput = document.getElementById('attach-file-input');

        // Función para que la app HABLE (Síntesis de voz)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Detener lecturas previas
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-AR';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender === 'user' ? 'user-msg' : 'bot-msg');
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Si responde el bot, que lo lea en voz alta
            if (sender === 'bot') {
                speakText(text);
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                const reply = data.reply || data.response || "No recibí respuesta.";
                addMessage(reply, 'bot');
            } catch (err) {
                addMessage("Error de conexión con Nico IA.", 'bot');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        // Acciones de botones
        camBtn.addEventListener('click', () => cameraFileInput.click());
        attachBtn.addEventListener('click', () => attachFileInput.click());

        cameraFileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                addMessage(`📷 Foto cargada: ${e.target.files[0].name}`, 'user');
            }
        });

        attachFileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                addMessage(`📎 Archivo adjunto: ${e.target.files[0].name}`, 'user');
            }
        });

        // Micrófono / Reconocimiento de Voz
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-AR';
            
            micBtn.addEventListener('click', () => {
                recognition.start();
                micBtn.classList.add('recording');
            });

            recognition.onresult = (event) => {
                userInput.value = event.results[0][0].transcript;
                micBtn.classList.remove('recording');
                sendMessage(); // Envía automáticamente al terminar de hablar
            };

            recognition.onerror = () => micBtn.classList.remove('recording');
            recognition.onend = () => micBtn.classList.remove('recording');
        }
    </script>
</body>
</html>
