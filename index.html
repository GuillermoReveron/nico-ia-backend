<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nico IA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { width: 100%; height: 100%; background-color: #121212; color: #ffffff; display: flex; flex-direction: column; overflow: hidden; }
        
        header { background-color: #1f1f1f; height: 56px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; flex-shrink: 0; }
        h1 { font-size: 1.2rem; color: #ffffff; font-weight: bold; }
        .voice-btn { background-color: #2e7d32; color: white; border: none; padding: 8px 14px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 18px; line-height: 1.4; word-break: break-word; font-size: 1.05rem; }
        .user-message { background-color: #1565c0; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot-message { background-color: #2a2a2a; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #383838; }
        
        #input-container { background-color: #1f1f1f; padding: 10px 12px; display: flex; gap: 8px; align-items: center; border-top: 1px solid #333; flex-shrink: 0; width: 100%; }
        .btn { background: #2a2a2a; border: 1px solid #383838; color: #ffffff; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; cursor: pointer; }
        
        input[type="text"] { flex: 1; min-width: 0; background-color: #2a2a2a; border: 1px solid #383838; color: white; padding: 12px 16px; border-radius: 24px; outline: none; font-size: 1rem; }
        .send-btn { background-color: #0084ff; border: none; color: white; }
    </style>
</head>
<body>
    <header>
        <h1>Nico IA</h1>
        <button class="voice-btn" id="toggle-voice" onclick="toggleVoice()">🔊 Voz ON</button>
    </header>

    <div id="chat-container">
        <div class="message bot-message">¡Buenas! Soy Nico IA. Podés hablarme por micrófono 🎙️, sacar fotos 📷 o escribir. ¿En qué laburamos hoy?</div>
    </div>

    <div id="input-container">
        <input type="file" id="file-input" style="display:none" onchange="handleFileSelect(event)">
        <button class="btn" onclick="document.getElementById('file-input').click()">📎</button>
        <button class="btn" id="mic-btn" onclick="startMic()">🎙️</button>
        <input type="text" id="user-input" placeholder="Escribí o hablá..." onkeypress="handleKeyPress(event)">
        <button class="btn send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        let voiceEnabled = true;

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById('toggle-voice');
            btn.textContent = voiceEnabled ? '🔊 Voz ON' : '🔇 Voz OFF';
            btn.style.backgroundColor = voiceEnabled ? '#2e7d32' : '#c62828';
        }

        function speak(text) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-AR';
            window.speechSynthesis.speak(utterance);
        }

        function appendMessage(text, isUser) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            msgDiv.textContent = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            return msgDiv;
        }

        function startMic() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('El reconocimiento de voz no está soportado en este dispositivo.');
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-AR';
            recognition.start();

            const micBtn = document.getElementById('mic-btn');
            micBtn.style.backgroundColor = '#c62828';

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('user-input').value = transcript;
                micBtn.style.backgroundColor = '#2a2a2a';
                sendMessage();
            };

            recognition.onerror = () => { micBtn.style.backgroundColor = '#2a2a2a'; };
            recognition.onend = () => { micBtn.style.backgroundColor = '#2a2a2a'; };
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, true);
            input.value = '';

            const loadingMsg = appendMessage("Nico IA está pensando...", false);

            try {
                // Petición con URL completa explícita para evitar fallas de ruta en WebView
                const response = await fetch('https://nico-ia-1.onrender.com/api/chat', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) {
                    throw new Error('Servidor error status ' + response.status);
                }

                const data = await response.json();
                const replyText = data.response || data.reply || 'Sin respuesta';
                
                loadingMsg.textContent = replyText;
                speak(replyText);

            } catch (error) {
                loadingMsg.textContent = 'Error de conexión con Nico IA. Reintentá en un momento.';
            }
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
