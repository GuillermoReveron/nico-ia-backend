<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nico IA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #1f1f1f;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid #333;
            color: #00e676;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background-color: #005c4b;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            align-self: flex-start;
            background-color: #202c33;
            color: #e9edef;
            border-bottom-left-radius: 2px;
        }

        #input-container {
            display: flex;
            padding: 10px;
            background-color: #1f1f1f;
            border-top: 1px solid #333;
            gap: 8px;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border-radius: 20px;
            border: none;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        #send-btn {
            background-color: #00e676;
            color: #121212;
            border: none;
            padding: 0 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        #send-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header>Nico IA</header>

    <div id="chat-container">
        <div class="message bot-message">¡Hola! Soy Nico IA. ¿En qué te puedo ayudar hoy?</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Escribí tu mensaje..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        // Función para reproducir texto en voz alta
        function speakText(text) {
            if ('speechSynthesis' in window) {
                // Cancelar cualquier audio anterior que esté sonando
                window.speechSynthesis.cancel();

                // Limpiar texto de asteriscos o caracteres raros de formato
                const cleanText = text.replace(/[*_#]/g, '');

                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'es-AR'; // Voz en castellano
                utterance.rate = 1.0;     // Velocidad normal
                utterance.pitch = 1.0;    // Tono normal

                window.speechSynthesis.speak(utterance);
            }
        }

        // Desbloquear audio al primer toque en la pantalla (exigencia de Android WebView)
        document.body.addEventListener('click', function() {
            if ('speechSynthesis' in window && window.speechSynthesis.speaking === false) {
                window.speechSynthesis.resume();
            }
        }, { once: true });

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const message = inputField.value.trim();
            if (!message) return;

            // Mostrar mensaje del usuario
            appendMessage(message, 'user-message');
            inputField.value = '';

            // Mostrar indicador de "Escribiendo..."
            const loadingDiv = appendMessage('Pensando respuesta...', 'bot-message');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                const botReply = data.reply || data.response || "No recibí respuesta.";

                // Reemplazar texto de carga por la respuesta final
                loadingDiv.innerText = botReply;

                // HABLAR EN VOZ ALTA LA RESPUESTA
                speakText(botReply);

            } catch (error) {
                loadingDiv.innerText = "Error de conexión con el servidor.";
            }
        }

        function appendMessage(text, className) {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        // Enviar con la tecla Enter
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
