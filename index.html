<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nico IA</title>
    <style>
        /* Bloqueo estricto de márgenes y scroll horizontal */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            background-color: #1f1f1f;
            padding: 14px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 1px solid #2a2a2a;
            flex-shrink: 0;
        }

        #chat-container {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-msg {
            background-color: #007acc;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-msg {
            background-color: #262626;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        /* Barra de entrada de texto e íconos */
        #input-container {
            background-color: #1f1f1f;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #2a2a2a;
            width: 100%;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0; /* Evita que el input empuje la pantalla */
            background-color: #2a2a2a;
            border: none;
            padding: 10px 14px;
            color: #ffffff;
            border-radius: 20px;
            outline: none;
            font-size: 0.95rem;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px;
            flex-shrink: 0; /* No se deforman ni mueven el layout */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #cam-btn { color: #4da6ff; }
        #send-btn { color: #007acc; }

        /* Ocultar input nativo de archivos */
        #file-input { display: none; }
    </style>
</head>
<body>

    <header>Nico IA</header>

    <div id="chat-container">
        <div class="message bot-msg">¡Hola! Soy Nico IA. ¿En qué te puedo ayudar hoy?</div>
    </div>

    <div id="input-container">
        <!-- BOTÓN DE CÁMARA (Recuperado y fijo) -->
        <button class="icon-btn" id="cam-btn" title="Tomar foto / Cargar imagen">📷</button>
        
        <!-- Campo de texto ajustado -->
        <input type="text" id="user-input" placeholder="Escribí un mensaje..." />
        
        <!-- Botón Enviar -->
        <button class="icon-btn" id="send-btn" title="Enviar">➔</button>
    </div>

    <!-- Trigger de la Cámara nativa del teléfono -->
    <input type="file" id="file-input" accept="image/*" capture="environment">

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const camBtn = document.getElementById('cam-btn');
        const fileInput = document.getElementById('file-input');

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender === 'user' ? 'user-msg' : 'bot-msg');
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                addMessage(data.reply || data.response || "No recibí respuesta.", 'bot');
            } catch (err) {
                addMessage("Error de conexión con Nico IA.", 'bot');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        // Evento para abrir la cámara/galería del celular al tocar 📷
        camBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                addMessage("📷 [Foto seleccionada lista para procesar]", 'user');
            }
        });
    </script>
</body>
</html>
