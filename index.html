<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nico IA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0e14;
            color: #f0f4f8;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #121824;
            padding: 12px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: #00f2fe;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #0052d4, #4364f7);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            align-self: flex-start;
            background-color: #1a2332;
            color: #e2e8f0;
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #visualizer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 65px;
            flex-shrink: 0;
            position: relative;
        }

        .ai-orb {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7F00FF, #E100FF, #00d2ff);
            background-size: 200% 200%;
            box-shadow: 0 0 15px rgba(127, 0, 255, 0.6);
            transition: transform 0.3s ease;
            animation: orbGlow 3s ease infinite alternate;
            cursor: pointer;
        }

        .ai-orb.speaking {
            animation: orbPulse 0.8s ease-in-out infinite alternate, orbGlow 1.5s ease infinite alternate;
            transform: scale(1.2);
            box-shadow: 0 0 25px rgba(225, 0, 255, 0.9);
        }

        @keyframes orbGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes orbPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        #input-container {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #121824;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            gap: 6px;
            flex-shrink: 0;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .action-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        #user-input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: #1a2332;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }

        #send-btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #ffffff;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #file-input, #camera-input { display: none; }
    </style>
</head>
<body>

    <header>Nico IA</header>

    <div id="chat-container">
        <div class="message bot-message">¡Hola! Soy Nico IA. ¿En qué te puedo ayudar hoy?</div>
    </div>

    <div id="visualizer-container">
        <!-- Tocando el óvalo se frena el audio inmediatamente -->
        <div id="ai-orb" class="ai-orb" onclick="stopAudio()" title="Tocar para callar"></div>
    </div>

    <div id="input-container">
        <button class="action-btn" onclick="document.getElementById('file-input').click()">
            <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.48-2.02-4.5-4.5-4.5S6 2.52 6 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-0.5z"/></svg>
        </button>
        <input type="file" id="file-input" onchange="handleFileSelect(event)">

        <button class="action-btn" onclick="document.getElementById('camera-input').click()">
            <svg viewBox="0 0 24 24"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>

        <button class="action-btn" id="mic-btn" onclick="toggleSpeechRecognition()">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.31 6-6.72h-1.7z"/></svg>
        </button>

        <input type="text" id="user-input" placeholder="Escribí un mensaje..." autocomplete="off">

        <button id="send-btn" onclick="sendMessage()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>

    <audio id="audio-player" style="display:none;"></audio>

    <script>
        const orb = document.getElementById('ai-orb');
        const audioPlayer = document.getElementById('audio-player');
        let recognition = null;
        let isListening = false;

        // Función para detener el audio y apagar la animación inmediatamente
        function stopAudio() {
            if (audioPlayer) {
                audioPlayer.pause();
                audioPlayer.currentTime = 0;
            }
            orb.classList.remove('speaking');
        }

        function playAudioResponse(base64Audio) {
            if (!base64Audio) return;

            stopAudio(); // Detener cualquier reproducción previa

            audioPlayer.src = "data:audio/mp3;base64," + base64Audio;
            
            audioPlayer.onplay = () => {
                orb.classList.add('speaking');
            };

            audioPlayer.onended = () => {
                orb.classList.remove('speaking');
            };

            audioPlayer.onerror = () => {
                orb.classList.remove('speaking');
            };

            audioPlayer.play().catch(e => console.error("Error al reproducir:", e));
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const message = inputField.value.trim();
            if (!message) return;

            // INTERRUMPIR AUDIO ANTERIOR AL ENVIAR NUEVO MENSAJE
            stopAudio();

            appendMessage(message, 'user-message');
            inputField.value = '';

            const loadingDiv = appendMessage('Pensando...', 'bot-message');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                const botReply = data.reply || data.response || "No recibí respuesta.";

                loadingDiv.innerText = botReply;

                if (data.audio) {
                    playAudioResponse(data.audio);
                }

            } catch (error) {
                loadingDiv.innerText = "Error de conexión con el servidor.";
                orb.classList.remove('speaking');
            }
        }

        function appendMessage(text, className) {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        function toggleSpeechRecognition() {
            stopAudio(); // Interrumpir audio al activar micrófono

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Reconocimiento de voz no disponible.");
                return;
            }

            if (isListening) {
                recognition.stop();
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'es-AR';
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('mic-btn').style.color = '#00f2fe';
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('user-input').value = transcript;
                sendMessage();
            };

            recognition.onerror = () => {
                isListening = false;
                document.getElementById('mic-btn').style.color = '#94a3b8';
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('mic-btn').style.color = '#94a3b8';
            };

            recognition.start();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                appendMessage(`Archivo seleccionado: ${file.name}`, 'user-message');
            }
        }

        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
