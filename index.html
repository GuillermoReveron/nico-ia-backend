<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nico IA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background-color: #1f1f1f; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; z-index: 10; }
        h1 { font-size: 1.2rem; color: #fff; font-weight: 600; }
        .voice-btn { background-color: #2e7d32; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: background 0.3s; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; background-image: linear-gradient(#121212, #181818); }
        #chat-container::-webkit-scrollbar { width: 6px; }
        #chat-container::-webkit-scrollbar-thumb { background-color: #333; border-radius: 3px; }

        .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.4; word-wrap: break-word; position: relative; font-size: 0.95rem; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .user-message { background-color: #1565c0; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot-message { background-color: #2a2a2a; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #3d3d3d; }
        
        .preview-container { max-width: 200px; margin-top: 8px; border-radius: 8px; overflow: hidden; border: 2px solid #444; display: none; }
        .preview-container img { width: 100%; height: auto; display: block; }
        .file-info { font-size: 0.8rem; color: #aaa; margin-top: 5px; display: flex; align-items: center; gap: 5px; }

        #input-container { background-color: #1f1f1f; padding: 12px 15px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #333; position: relative; z-index: 10; }
        
        .attach-btn, .camera-btn, .mic-btn { background: #2a2a2a; border: 1px solid #3d3d3d; color: #aaa; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.3rem; transition: all 0.3s; }
        .attach-btn:hover, .camera-btn:hover, .mic-btn:hover { background-color: #333; color: #fff; border-color: #555; }
        
        input[type="text"] { flex: 1; background-color: #2a2a2a; border: 1px solid #3d3d3d; color: white; padding: 12px 18px; border-radius: 25px; outline: none; font-size: 1rem; transition: border-color 0.3s; }
        input[type="text"]:focus { border-color: #1565c0; }
        
        .send-btn { background-color: #0084ff; border: none; color: white; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; transition: background 0.3s, transform 0.2s; }
        .send-btn:hover { background-color: #0073e6; transform: scale(1.05); }
        .send-btn:active { transform: scale(0.95); }

        /* Estilos para la cámara */
        #camera-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #video-preview { width: 100%; max-width: 500px; border-radius: 12px; background: #000; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        #capture-btn { background: #c62828; color: white; border: none; width: 70px; height: 70px; border-radius: 50%; margin-top: 20px; cursor: pointer; border: 5px solid white; box-shadow: 0 0 15px rgba(255,255,255,0.3); }
        #close-camera { position: absolute; top: 20px; right: 20px; background: none; border: none; color: white; font-size: 2rem; cursor: pointer; }

    </style>
</head>
<body>
    <header>
        <h1>Nico IA</h1>
        <button class="voice-btn" id="toggle-voice" onclick="toggleVoice()">🔊 Voz ON</button>
    </header>

    <div id="chat-container">
        <div class="message bot-message">
            ¡Buenas! Soy Nico IA. Podés hablarme por micrófono 🎙️, mostrarme cosas con la cámara 📷 o adjuntar archivos y PDFs 📎. ¿En qué laburamos hoy?
        </div>
    </div>

    <!-- Contenedor de previsualización de adjuntos -->
    <div style="padding: 0 15px; background: #121212;">
        <div id="attachment-preview" class="preview-container">
            <img id="preview-img" src="" alt="Previsualización">
            <div id="file-data" class="file-info" style="padding: 5px 10px;"></div>
        </div>
    </div>

    <div id="input-container">
        <!-- Input de archivo oculto -->
        <input type="file" id="file-input" style="display:none" onchange="handleFileSelect(event)" accept="image/*,application/pdf">
        
        <button class="attach-btn" onclick="document.getElementById('file-input').click()" title="Adjuntar archivo o PDF">📎</button>
        <button class="camera-btn" onclick="openCamera()" title="Usar cámara">📷</button>
        <button class="mic-btn" id="mic-btn" onclick="startMic()" title="Hablar por micrófono">🎙️</button>
        
        <input type="text" id="user-input" placeholder="Escribí o hablá..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <!-- Modal de Cámara -->
    <div id="camera-modal">
        <button id="close-camera" onclick="closeCamera()">✕</button>
        <video id="video-preview" autoplay playsinline></video>
        <canvas id="capture-canvas" style="display:none;"></canvas>
        <button id="capture-btn" onclick="capturePhoto()"></button>
    </div>

    <script>
        let voiceEnabled = true;
        let currentFile = null;

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById('toggle-voice');
            btn.textContent = voiceEnabled ? '🔊 Voz ON' : '🔇 Voz OFF';
            btn.style.backgroundColor = voiceEnabled ? '#2e7d32' : '#c62828';
        }

        // --- Sintetizador de Voz (con acento argentino es-AR) ---
        function speak(text) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-AR'; // Clave para el acento Nico IA
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function appendMessage(text, isUser, file = null) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            msgDiv.textContent = text;

            if (file) {
                if (file.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(file);
                    img.style.maxWidth = '100%';
                    img.style.borderRadius = '8px';
                    img.style.marginTop = '8px';
                    img.style.display = 'block';
                    msgDiv.appendChild(img);
                } else {
                    const fileInfo = document.createElement('div');
                    fileInfo.className = 'file-info';
                    fileInfo.innerHTML = `📎 <strong>${file.name}</strong>`;
                    fileInfo.style.color = isUser ? '#fff' : '#aaa';
                    msgDiv.appendChild(fileInfo);
                }
            }

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        // --- Manejo de Archivos ---
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            displayFilePreview(file);
        }

        function displayFilePreview(file) {
            currentFile = file;
            const previewContainer = document.getElementById('attachment-preview');
            const previewImg = document.getElementById('preview-img');
            const fileData = document.getElementById('file-data');
            
            previewContainer.style.display = 'block';
            fileData.textContent = `📎 ${file.name} (${(file.size/1024).toFixed(1)} KB)`;

            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImg.src = e.target.result;
                    previewImg.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                previewImg.style.display = 'none';
            }
        }

        function clearAttachment() {
            currentFile = null;
            document.getElementById('attachment-preview').style.display = 'none';
            document.getElementById('file-input').value = '';
        }

        // --- Manejo de Cámara ---
        let stream = null;
        async function openCamera() {
            const modal = document.getElementById('camera-modal');
            const video = document.getElementById('video-preview');
            modal.style.display = 'flex';
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error cámara:", err);
                alert("No se pudo acceder a la cámara.");
                closeCamera();
            }
        }

        function closeCamera() {
            const modal = document.getElementById('camera-modal');
            const video = document.getElementById('video-preview');
            if (stream) stream.getTracks().forEach(track => track.stop());
            video.srcObject = null;
            modal.style.display = 'none';
        }

        function capturePhoto() {
            const video = document.getElementById('video-preview');
            const canvas = document.getElementById('capture-canvas');
            const context = canvas.getContext('2d');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob((blob) => {
                const file = new File([blob], `captura_${Date.now()}.jpg`, { type: 'image/jpeg' });
                displayFilePreview(file);
                closeCamera();
            }, 'image/jpeg');
        }

        // --- Reconocimiento de Voz (Microfono es-AR) ---
        let recognition = null;
        function startMic() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Tu navegador no soporta reconocimiento de voz. Probá con Chrome.');
                return;
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'es-AR';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            const micBtn = document.getElementById('mic-btn');
            micBtn.style.backgroundColor = '#c62828';
            micBtn.style.color = 'white';
            micBtn.textContent = '🛑';

            recognition.start();

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('user-input').value = text;
                sendMessage();
            };

            recognition.onerror = (event) => { console.error("Error mic:", event.error); resetMicBtn(); };
            recognition.onend = () => { resetMicBtn(); };
        }

        function resetMicBtn() {
            const micBtn = document.getElementById('mic-btn');
            micBtn.style.backgroundColor = '#2a2a2a';
            micBtn.style.color = '#aaa';
            micBtn.textContent = '🎙️';
        }

        // --- Envío de Mensajes y Lógica de Chat (CORREGIDO PARA RENDER) ---
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text && !currentFile) return;

            appendMessage(text || (currentFile ? `Envió un archivo: ${currentFile.name}` : ''), true, currentFile);
            const fileToSend = currentFile;
            clearAttachment();
            input.value = '';

            try {
                // *** LA CORRECCIÓN CLAVE: Petición relativa directa a Render ***
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text || (fileToSend ? "Analizá este archivo." : "") })
                });

                if (!response.ok) throw new Error('Error en la respuesta del servidor');

                const data = await response.json();
                const replyText = data.response || data.reply || 'No recibí respuesta.';
                
                appendMessage(replyText, false);
                speak(replyText);

            } catch (error) {
                console.error(error);
                appendMessage('Error de conexión con Nico IA. Por favor reintentá.', false);
            }
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
