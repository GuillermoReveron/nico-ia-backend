<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nico IA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1f1f1f; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        h1 { font-size: 1.2rem; color: #fff; }
        .voice-btn { background-color: #2e7d32; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.4; word-wrap: break-word; }
        .user-message { background-color: #1565c0; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot-message { background-color: #2a2a2a; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #3d3d3d; }
        #input-container { background-color: #1f1f1f; padding: 15px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #333; }
        input[type="text"] { flex: 1; background-color: #2a2a2a; border: 1px solid #3d3d3d; color: white; padding: 12px 18px; border-radius: 25px; outline: none; font-size: 1rem; }
        .icon-btn { background: #2a2a2a; border: 1px solid #3d3d3d; color: white; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; }
        .send-btn { background-color: #0084ff; border: none; color: white; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; }
    </style>
</head>
<body>
    <header>
        <h1>Nico IA</h1>
        <button class="voice-btn" id="toggle-voice" onclick="toggleVoice()">🔊 Voz ON</button>
    </header>

    <div id="chat-container">
        <div class="message bot-message">¡Buenas! Soy Nico IA. Podés hablarme por micrófono o escribirme. ¿En qué laburamos hoy?</div>
    </div>

    <div id="input-container">
        <button class="icon-btn" onclick="startMic()">🎙️</button>
        <input type="text" id="user-input" placeholder="Escribí o hablá..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        let voiceEnabled = true;

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById('toggle-voice');
            btn.textContent = voiceEnabled ? '🔊 Voz ON' : '🔇 Voz OFF';
            btn.style.backgroundColor = voiceEnabled ? '#2e7d32' : '#c62828';
        }

        function speak(text) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-AR';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function appendMessage(text, isUser) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            msgDiv.textContent = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, true);
            input.value = '';

            try {
                // Petición relativa directa a Render
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) throw new Error('Error en la respuesta del servidor');

                const data = await response.json();
                const replyText = data.response || data.reply || 'Sin respuesta';
                
                appendMessage(replyText, false);
                speak(replyText);

            } catch (error) {
                console.error(error);
                appendMessage('Error de conexión con Nico IA. Por favor reintentá.', false);
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function startMic() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Tu navegador no soporta reconocimiento de voz.');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-AR';
            recognition.start();

            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                document.getElementById('user-input').value = text;
                sendMessage();
            };
        }
    </script>
</body>
</html>
