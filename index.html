<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nico IA</title>
    <style>
        /* Bloqueo estricto de pantalla para evitar desplazamientos y descuadres */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            background-color: #1f1f1f;
            padding: 14px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 1px solid #2a2a2a;
            flex-shrink: 0;
        }

        /* Contenedor principal de mensajes */
        #chat-container {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-msg {
            background-color: #007acc;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-msg {
            background-color: #262626;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        /* Barra de entrada de texto e íconos */
        #input-container {
            background-color: #1f1f1f;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-top: 1px solid #2a2a2a;
            width: 100%;
            flex-shrink: 0;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            background-color: #2a2a2a;
            border: none;
            padding: 10px 12px;
            color: #ffffff;
            border-radius: 20px;
            outline: none;
            font-size: 0.95rem;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 4px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4da6ff;
            transition: transform 0.1s ease;
        }

        .icon-btn:active {
            transform: scale(0.9);
        }

        #send-btn {
            color: #007acc;
            font-weight: bold;
        }

        /* Indicador de micrófono encendido */
        .recording {
            color: #ff4444 !important;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 1; }
            to { opacity: 0.4; }
        }

        /* Inputs de archivo ocultos */
        .hidden-input {
            display: none;
        }
    </style>
</head>
<body>

    <header>Nico IA</header>

    <div id="chat-container">
        <div class="message bot-msg">¡Hola! Soy Nico IA. ¿En qué te puedo ayudar hoy?</div>
    </div>

    <!-- Barra inferior con todos las herramientas -->
    <div id="input-container">
        <!-- 1. Botón Cámara Nativa -->
        <button class="icon-btn" id="cam-btn" title="Tomar foto">📷</button>
        
        <!-- 2. Botón Adjuntar Archivo/Galería -->
        <button class="icon-btn" id="attach-btn" title="Adjuntar archivo">📎</button>
        
        <!-- 3. Botón Micrófono / Reconocimiento de voz -->
        <button class="icon-btn" id="mic-btn" title="Dictar mensaje">🎙️</button>
        
        <!-- Campo de Texto -->
        <input type="text" id="user-input" placeholder="Escribí un mensaje..." />
        
        <!-- 4. Botón Enviar -->
        <button class="icon-btn" id="send-btn" title="Enviar">➔</button>
    </div>

    <!-- Triggers de archivos ocultos -->
    <input type="file" id="camera-file-input" class="hidden-input" accept="image/*" capture="environment">
    <input type="file" id="attach-file-input" class="hidden-input" accept="*/*">

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        
        const camBtn = document.getElementById('cam-btn');
        const attachBtn = document.getElementById('attach-btn');
        const micBtn = document.getElementById('mic-btn');

        const cameraFileInput = document.getElementById('camera-file-input');
        const attachFileInput = document.getElementById('attach-file-input');

        // Función para agregar mensajes al chat
        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender === 'user' ? 'user-msg' : 'bot-msg');
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Función para enviar texto al servidor
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                addMessage(data.reply || data.response || "No recibí respuesta.", 'bot');
            } catch (err) {
                addMessage("Error de conexión con el servidor.", 'bot');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        // 📷 1. Acción de la CÁMARA
        camBtn.addEventListener('click', () => {
            cameraFileInput.click();
        });

        cameraFileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                const fileName = e.target.files[0].name;
                addMessage(`📷 Foto capturada: ${fileName}`, 'user');
            }
        });

        // 📎 2. Acción de ADJUNTAR ARCHIVO / GALERÍA
        attachBtn.addEventListener('click', () => {
            attachFileInput.click();
        });

        attachFileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                const fileName = e.target.files[0].name;
                addMessage(`📎 Archivo adjunto: ${fileName}`, 'user');
            }
        });

        // 🎙️ 3. Acción del MICRÓFONO (Reconocimiento de voz nativo Web Speech API)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-AR';
            recognition.continuous = false;
            recognition.interimResults = false;

            let isRecording = false;

            micBtn.addEventListener('click', () => {
                if (!isRecording) {
                    recognition.start();
                    micBtn.classList.add('recording');
                    userInput.placeholder = "Escuchando...";
                    isRecording = true;
                } else {
                    recognition.stop();
                    micBtn.classList.remove('recording');
                    userInput.placeholder = "Escribí un mensaje...";
                    isRecording = false;
                }
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                micBtn.classList.remove('recording');
                userInput.placeholder = "Escribí un mensaje...";
                isRecording = false;
            };

            recognition.onerror = () => {
                micBtn.classList.remove('recording');
                userInput.placeholder = "Escribí un mensaje...";
                isRecording = false;
            };

            recognition.onend = () => {
                micBtn.classList.remove('recording');
                userInput.placeholder = "Escribí un mensaje...";
                isRecording = false;
            };
        } else {
            micBtn.addEventListener('click', () => {
                alert("El reconocimiento de voz no está soportado en este navegador.");
            });
        }
    </script>
</body>
</html>
