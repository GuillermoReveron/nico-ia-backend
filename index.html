<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nico IA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0e14;
            color: #f0f4f8;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Encabezado */
        header {
            background-color: #121824;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: #00f2fe;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Área de Chat */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #0052d4, #4364f7);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            align-self: flex-start;
            background-color: #1a2332;
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Óvalo Animado (Azul y Morado) */
        #visualizer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
            min-height: 80px;
        }

        .ai-orb {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7F00FF, #E100FF, #00d2ff);
            background-size: 200% 200%;
            box-shadow: 0 0 20px rgba(127, 0, 255, 0.6), 0 0 40px rgba(0, 210, 255, 0.4);
            transition: all 0.3s ease;
            animation: orbGlow 3s ease infinite alternate;
        }

        .ai-orb.speaking {
            animation: orbPulse 0.8s ease-in-out infinite alternate, orbGlow 1.5s ease infinite alternate;
            transform: scale(1.25);
            box-shadow: 0 0 30px rgba(225, 0, 255, 0.9), 0 0 60px rgba(0, 242, 254, 0.8);
        }

        @keyframes orbGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes orbPulse {
            0% { transform: scale(1) rotate(0deg); border-radius: 45% 55% 60% 40% / 55% 45% 55% 45%; }
            100% { transform: scale(1.2) rotate(10deg); border-radius: 60% 40% 45% 55% / 45% 55% 45% 55%; }
        }

        /* Barra Inferior y Botones */
        #input-container {
            display: flex;
            align-items: center;
            padding: 12px;
            background-color: #121824;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            gap: 8px;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .action-btn:active {
            background-color: rgba(255, 255, 255, 0.1);
            color: #00f2fe;
        }

        .action-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        #user-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: #1a2332;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }

        #user-input::placeholder {
            color: #64748b;
        }

        #send-btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #ffffff;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 114, 255, 0.3);
        }

        /* Inputs invisibles para cámara y archivos */
        #file-input, #camera-input {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <span>Nico IA</span>
    </header>

    <div id="chat-container">
        <div class="message bot-message">¡Hola! Soy Nico IA. ¿En qué te puedo ayudar hoy?</div>
    </div>

    <!-- Visualizador: Óvalo Animado (Azul / Morado) -->
    <div id="visualizer-container">
        <div id="ai-orb" class="ai-orb"></div>
    </div>

    <!-- Barra de Entradas y Herramientas -->
    <div id="input-container">
        <!-- Adjuntar Archivo -->
        <button class="action-btn" onclick="document.getElementById('file-input').click()" title="Adjuntar archivo">
            <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.48-2.02-4.5-4.5-4.5S6 2.52 6 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-0.5z"/></svg>
        </button>
        <input type="file" id="file-input" onchange="handleFileSelect(event)">

        <!-- Cámara -->
        <button class="action-btn" onclick="document.getElementById('camera-input').click()" title="Tomar foto">
            <svg viewBox="0 0 24 24"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="handleFileSelect(event)">

        <!-- Micrófono (Reconocimiento de Voz) -->
        <button class="action-btn" id="mic-btn" onclick="toggleSpeechRecognition()" title="Dictar por voz">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.31 6-6.72h-1.7z"/></svg>
        </button>

        <!-- Campo de texto -->
        <input type="text" id="user-input" placeholder="Escribí un mensaje..." autocomplete="off">

        <!-- Botón Enviar -->
        <button id="send-btn" onclick="sendMessage()" title="Enviar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>

    <script>
        const orb = document.getElementById('ai-orb');
        let recognition = null;
        let isListening = false;
        let synth = window.speechSynthesis;

        // Función para hablar (Conectada con la APK nativa)
        function speakText(text) {
            const cleanText = text.replace(/[*_#`~]/g, '').trim();
            if (!cleanText) return;

            // 1. PRIORIDAD: Usar el motor de voz nativo de Android si está dentro de la APK
            if (window.AndroidHost && typeof window.AndroidHost.speak === 'function') {
                window.AndroidHost.speak(cleanText);
                orb.classList.add('speaking');
                
                // Calcular tiempo de la animación según la longitud del texto
                const speechDuration = Math.max(2500, cleanText.length * 70);
                setTimeout(() => {
                    orb.classList.remove('speaking');
                }, speechDuration);
                return;
            }

            // 2. FALLBACK: Usar el navegador si no está en la APK
            if (synth) {
                synth.cancel();
                const utterance = new SpeechSynthesisUtterance(cleanText);
                let voices = synth.getVoices();
                let esVoice = voices.find(v => v.lang.includes('es-AR') || v.lang.includes('es-ES') || v.lang.includes('es'));
                if (esVoice) utterance.voice = esVoice;

                utterance.lang = 'es-AR';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;

                utterance.onstart = () => orb.classList.add('speaking');
                utterance.onend = () => orb.classList.remove('speaking');
                utterance.onerror = () => orb.classList.remove('speaking');

                setTimeout(() => {
                    synth.speak(utterance);
                }, 100);
            }
        }

        if (synth && synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = () => { synth.getVoices(); };
        }

        document.body.addEventListener('touchstart', () => {
            if (synth && synth.speaking === false) {
                synth.resume();
            }
        }, { once: true });

        // Enviar mensaje al Backend
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const message = inputField.value.trim();
            if (!message) return;

            if (synth) synth.resume();

            appendMessage(message, 'user-message');
            inputField.value = '';

            const loadingDiv = appendMessage('Pensando...', 'bot-message');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                const botReply = data.reply || data.response || "No recibí respuesta.";

                loadingDiv.innerText = botReply;

                // REPRODUCIR VOZ Y MOVER ÓVALO
                speakText(botReply);

            } catch (error) {
                loadingDiv.innerText = "Error de conexión con el servidor.";
                orb.classList.remove('speaking');
            }
        }

        function appendMessage(text, className) {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        // Reconocimiento de Voz (Micrófono)
        function toggleSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("El reconocimiento de voz no está disponible en este dispositivo.");
                return;
            }

            if (isListening) {
                recognition.stop();
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'es-AR';
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('mic-btn').style.color = '#00f2fe';
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('user-input').value = transcript;
                sendMessage();
            };

            recognition.onerror = () => {
                isListening = false;
                document.getElementById('mic-btn').style.color = '#94a3b8';
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('mic-btn').style.color = '#94a3b8';
            };

            recognition.start();
        }

        // Captura de archivos / cámara
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                appendMessage(`Archivo seleccionado: ${file.name}`, 'user-message');
            }
        }

        // Presionar Enter para enviar
        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
