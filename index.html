<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nico IA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #121212; color: #fff; display: flex; flex-direction: column; }
        
        header { background: #1f1f1f; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; height: 55px; }
        h1 { font-size: 1.1rem; }
        .voice-btn { background: #2e7d32; color: white; border: none; padding: 6px 12px; border-radius: 15px; font-size: 0.8rem; font-weight: bold; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 15px; line-height: 1.4; word-break: break-word; font-size: 0.95rem; }
        .user-message { background-color: #1565c0; color: white; align-self: flex-end; }
        .bot-message { background-color: #2a2a2a; color: #e0e0e0; align-self: flex-start; border: 1px solid #333; }
        
        #input-container { background: #1f1f1f; padding: 10px; display: flex; gap: 6px; align-items: center; border-top: 1px solid #333; height: 60px; width: 100%; }
        .btn { background: #2a2a2a; border: 1px solid #333; color: #fff; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
        
        input[type="text"] { flex: 1; min-width: 0; background: #2a2a2a; border: 1px solid #333; color: white; padding: 10px 14px; border-radius: 20px; outline: none; font-size: 0.95rem; }
        .send-btn { background-color: #0084ff; border: none; }
    </style>
</head>
<body>
    <header>
        <h1>Nico IA</h1>
        <button class="voice-btn" id="toggle-voice" onclick="toggleVoice()">🔊 Voz ON</button>
    </header>

    <div id="chat-container">
        <div class="message bot-message">¡Buenas! Soy Nico IA. Podés hablarme por micrófono 🎙️, sacar fotos 📷 o escribirme. ¿En qué te doy una mano hoy?</div>
    </div>

    <div id="input-container">
        <input type="file" id="file-input" style="display:none" onchange="handleFileSelect(event)">
        <button class="btn" onclick="document.getElementById('file-input').click()">📎</button>
        <button class="btn" id="mic-btn" onclick="startMic()">🎙️</button>
        <input type="text" id="user-input" placeholder="Escribí o hablá..." onkeypress="handleKeyPress(event)">
        <button class="btn send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        let voiceEnabled = true;

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById('toggle-voice');
            btn.textContent = voiceEnabled ? '🔊 Voz ON' : '🔇 Voz OFF';
            btn.style.backgroundColor = voiceEnabled ? '#2e7d32' : '#c62828';
        }

        function speak(text) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-AR';
            window.speechSynthesis.speak(utterance);
        }

        function appendMessage(text, isUser) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            msgDiv.textContent = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function startMic() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('El reconocimiento de voz no está soportado en este navegador webView.');
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-AR';
            recognition.start();

            const micBtn = document.getElementById('mic-btn');
            micBtn.style.backgroundColor = '#c62828';

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('user-input').value = transcript;
                micBtn.style.backgroundColor = '#2a2a2a';
                sendMessage();
            };

            recognition.onerror = () => { micBtn.style.backgroundColor = '#2a2a2a'; };
            recognition.onend = () => { micBtn.style.backgroundColor = '#2a2a2a'; };
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, true);
            input.value = '';

            try {
                // Petición con ruta relativa estricta
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) {
                    throw new Error('Estado servidor: ' + response.status);
                }

                const data = await response.json();
                const replyText = data.response || data.reply || 'Sin respuesta';
                appendMessage(replyText, false);
                speak(replyText);

            } catch (error) {
                console.error(error);
                appendMessage('Error de conexión (' + error.message + '). Reintentá.', false);
            }
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
