<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nico IA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0e14;
            color: #f0f4f8;
        }

        body {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #sidebar-overlay, #camera-modal-overlay, #live-camera-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: #121824;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 101;
            display: flex;
            flex-direction: column;
            transition: left 0.3s ease;
        }

        #sidebar.open { left: 0; }
        #sidebar-overlay.open { display: block; opacity: 1; }
        #camera-modal-overlay.open { display: flex; opacity: 1; align-items: center; justify-content: center; }
        #live-camera-modal.open { display: flex; opacity: 1; flex-direction: column; align-items: center; justify-content: center; z-index: 110; }

        .modal-box {
            background: #121824;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            width: 85%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 102;
        }

        .modal-title {
            color: #00f2fe;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
        }

        .modal-btn {
            background: #1a2332;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        /* Modal cámara en vivo */
        .camera-view-box {
            position: relative;
            width: 90%;
            max-width: 400px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #webcam-video {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }

        .cam-controls {
            display: flex;
            justify-content: space-around;
            width: 100%;
            padding: 15px;
            background: #121824;
        }

        .cam-btn {
            background: #00f2fe;
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .cam-btn.cancel {
            background: #ef4444;
            color: #fff;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #00f2fe;
        }

        .new-chat-side-btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 10px 14px;
            margin: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .session-item {
            padding: 10px 12px;
            border-radius: 10px;
            background: #1a2332;
            color: #cbd5e1;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .session-item.active {
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.1);
            color: #00f2fe;
            font-weight: 600;
        }

        .delete-session-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 4px;
        }

        header {
            background-color: #121824;
            padding: 12px 16px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: #00f2fe;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #00f2fe;
            cursor: pointer;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
        }

        .header-title {
            flex: 1;
            text-align: center;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #0052d4, #4364f7);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            align-self: flex-start;
            background-color: #1a2332;
            color: #e2e8f0;
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            margin-top: 6px;
            display: block;
            object-fit: contain;
        }

        .pdf-download-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 8px 12px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        #visualizer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 55px;
            flex-shrink: 0;
        }

        .ai-orb {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7F00FF, #E100FF, #00d2ff);
            background-size: 200% 200%;
            box-shadow: 0 0 15px rgba(127, 0, 255, 0.6);
            transition: transform 0.3s ease;
            animation: orbGlow 3s ease infinite alternate;
            cursor: pointer;
        }

        .ai-orb.speaking {
            animation: orbPulse 0.8s ease-in-out infinite alternate, orbGlow 1.5s ease infinite alternate;
            transform: scale(1.15);
            box-shadow: 0 0 25px rgba(225, 0, 255, 0.9);
        }

        @keyframes orbGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes orbPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        #input-container {
            display: flex;
            align-items: center;
            padding: 8px 6px;
            background-color: #121824;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            gap: 4px;
            flex-shrink: 0;
            width: 100%;
            box-sizing: border-box;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            padding: 0;
        }

        .action-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        #user-input {
            flex: 1;
            min-width: 0;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: #1a2332;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        #send-btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #ffffff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        #file-input, #gallery-input { display: none; }
    </style>
</head>
<body>

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">Historial de Charlas</span>
            <button class="menu-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <button class="new-chat-side-btn" onclick="createNewSession()">
            ➕ Nueva Charla
        </button>
        <div class="sessions-list" id="sessions-list"></div>
    </div>

    <!-- Modal de Selección -->
    <div id="camera-modal-overlay" onclick="closeCameraModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-title">Seleccionar Opción</div>
            <button class="modal-btn" onclick="startLiveCamera('user')">📸 Tomar Foto con Cámara</button>
            <button class="modal-btn" onclick="openGallery()">🖼️ Buscar en Galería</button>
        </div>
    </div>

    <!-- Modal Visor de Cámara en Vivo -->
    <div id="live-camera-modal">
        <div class="camera-view-box">
            <video id="webcam-video" autoplay playsinline muted></video>
            <canvas id="webcam-canvas" style="display:none;"></canvas>
            <div class="cam-controls">
                <button class="cam-btn cancel" onclick="stopLiveCamera()">Cancelar</button>
                <button class="cam-btn" onclick="capturePhotoFromCamera()">📸 Capturar</button>
            </div>
        </div>
    </div>

    <header>
        <button class="menu-btn" onclick="toggleSidebar()" title="Ver historial">☰</button>
        <div class="header-title">Nico IA</div>
        <button class="action-btn" onclick="createNewSession()" title="Nueva Charla" style="color:#00f2fe;">➕</button>
    </header>

    <div id="chat-container"></div>

    <div id="visualizer-container">
        <div id="ai-orb" class="ai-orb" onclick="stopAudio()" title="Tocar para callar"></div>
    </div>

    <div id="input-container">
        <!-- Documentos -->
        <button class="action-btn" onclick="document.getElementById('file-input').click()" title="Adjuntar Documento">
            <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.48-2.02-4.5-4.5-4.5S6 2.52 6 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-0.5z"/></svg>
        </button>
        <input type="file" id="file-input" accept=".txt,.pdf,.doc,.docx,.csv,.json" onchange="handleDocumentSelect(event)">

        <!-- Cámara / Galería -->
        <button class="action-btn" onclick="openCameraModal()" title="Cámara / Galería">
            <svg viewBox="0 0 24 24"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>

        <input type="file" id="gallery-input" accept="image/*,video/*" onchange="handleMediaSelected(event)">

        <!-- Micrófono -->
        <button class="action-btn" id="mic-btn" onclick="toggleSpeechRecognition()">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.31 6-6.72h-1.7z"/></svg>
        </button>

        <input type="text" id="user-input" placeholder="Escribí un mensaje..." autocomplete="off">

        <button id="send-btn" onclick="sendMessage()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>

    <audio id="audio-player" style="display:none;"></audio>

    <script>
        const orb = document.getElementById('ai-orb');
        const audioPlayer = document.getElementById('audio-player');
        let recognition = null;
        let isListening = false;
        let userLocation = "Benito Juárez, Provincia de Buenos Aires, Argentina";
        let selectedBase64Image = "";
        let selectedFileB64 = "";
        let selectedFilename = "";
        let videoStream = null;

        let currentSessionId = localStorage.getItem('nico_current_session') || 'session_' + Date.now();
        let sessions = JSON.parse(localStorage.getItem('nico_sessions') || '{}');

        if (Object.keys(sessions).length === 0) {
            sessions[currentSessionId] = {
                title: "Nueva Charla",
                messages: [{ sender: 'bot', text: '¡Buenas! Soy Nico IA. ¿En qué te doy una mano hoy?' }]
            };
            saveSessions();
        } else if (!sessions[currentSessionId]) {
            currentSessionId = Object.keys(sessions)[0];
        }

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition((pos) => {
                userLocation = `Latitud ${pos.coords.latitude}, Longitud ${pos.coords.longitude} (Benito Juárez, Buenos Aires, Argentina)`;
            }, (err) => console.log("GPS por defecto"));
        }

        function openCameraModal() {
            document.getElementById('camera-modal-overlay').classList.add('open');
        }

        function closeCameraModal(e) {
            document.getElementById('camera-modal-overlay').classList.remove('open');
        }

        function openGallery() {
            closeCameraModal();
            document.getElementById('gallery-input').click();
        }

        // Abrir Visor de Cámara WebRTC (Garantizado en WebView Android)
        async function startLiveCamera() {
            closeCameraModal();
            const modal = document.getElementById('live-camera-modal');
            const video = document.getElementById('webcam-video');
            modal.classList.add('open');

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { ideal: "environment" } }, 
                    audio: false 
                });
                video.srcObject = videoStream;
            } catch (err) {
                console.error("Error abriendo cámara en vivo:", err);
                alert("No se pudo iniciar la cámara en vivo. Usando alternativa de archivo.");
                stopLiveCamera();
                document.getElementById('gallery-input').click();
            }
        }

        function stopLiveCamera() {
            const modal = document.getElementById('live-camera-modal');
            modal.classList.remove('open');
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
        }

        function capturePhotoFromCamera() {
            const video = document.getElementById('webcam-video');
            const canvas = document.getElementById('webcam-canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            selectedBase64Image = canvas.toDataURL('image/jpeg', 0.85);
            stopLiveCamera();
            appendMessageToUI("📷 Foto capturada con la cámara", 'user-message', selectedBase64Image);
        }

        function saveSessions() {
            localStorage.setItem('nico_sessions', JSON.stringify(sessions));
            localStorage.setItem('nico_current_session', currentSessionId);
            renderSessionsList();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        function renderSessionsList() {
            const listContainer = document.getElementById('sessions-list');
            listContainer.innerHTML = '';

            Object.keys(sessions).reverse().forEach(id => {
                const session = sessions[id];
                const item = document.createElement('div');
                item.className = `session-item ${id === currentSessionId ? 'active' : ''}`;
                
                const titleSpan = document.createElement('span');
                titleSpan.style.overflow = 'hidden';
                titleSpan.style.textOverflow = 'ellipsis';
                titleSpan.innerText = session.title || "Charla";
                titleSpan.onclick = () => switchSession(id);

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-session-btn';
                delBtn.innerHTML = '🗑️';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteSession(id);
                };

                item.appendChild(titleSpan);
                item.appendChild(delBtn);
                listContainer.appendChild(item);
            });
        }

        function switchSession(id) {
            currentSessionId = id;
            localStorage.setItem('nico_current_session', currentSessionId);
            renderCurrentChat();
            renderSessionsList();
            toggleSidebar();
            stopAudio();
        }

        function createNewSession() {
            const newId = 'session_' + Date.now();
            sessions[newId] = {
                title: "Nueva Charla",
                messages: [{ sender: 'bot', text: '¡Buenas! Soy Nico IA. ¿En qué te doy una mano hoy?' }]
            };
            currentSessionId = newId;
            saveSessions();
            renderCurrentChat();
            if (document.getElementById('sidebar').classList.contains('open')) {
                toggleSidebar();
            }
            stopAudio();
        }

        function deleteSession(id) {
            delete sessions[id];
            const remainingKeys = Object.keys(sessions);
            if (remainingKeys.length === 0) {
                createNewSession();
            } else {
                currentSessionId = remainingKeys[remainingKeys.length - 1];
                saveSessions();
                renderCurrentChat();
            }
        }

        function renderCurrentChat() {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            const activeSession = sessions[currentSessionId];
            if (!activeSession) return;

            activeSession.messages.forEach(msg => {
                const className = msg.sender === 'user' ? 'user-message' : 'bot-message';
                appendMessageToUI(msg.text, className, msg.image, msg.pdf);
            });
        }

        function handleMediaSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                selectedBase64Image = e.target.result;
                appendMessageToUI(`📷 Archivo listo: ${file.name}`, 'user-message', selectedBase64Image);
            };
            reader.readAsDataURL(file);
        }

        // Lectura completa de documentos a Base64 para procesamiento en servidor
        function handleDocumentSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedFilename = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedFileB64 = e.target.result;
                appendMessageToUI(`📄 Documento adjuntado: ${file.name}`, 'user-message');
            };
            reader.readAsDataURL(file);
        }

        function stopAudio() {
            if (audioPlayer) {
                audioPlayer.pause();
                audioPlayer.currentTime = 0;
            }
            orb.classList.remove('speaking');
        }

        function playAudioResponse(base64Audio) {
            if (!base64Audio) return;
            stopAudio();
            audioPlayer.src = "data:audio/mp3;base64," + base64Audio;
            audioPlayer.onplay = () => orb.classList.add('speaking');
            audioPlayer.onended = () => orb.classList.remove('speaking');
            audioPlayer.onerror = () => orb.classList.remove('speaking');
            audioPlayer.play().catch(e => console.error("Audio error:", e));
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            let message = inputField.value.trim();
            
            if (!message && !selectedBase64Image && !selectedFileB64) return;
            
            if (!message && selectedFileB64) {
                message = `Hacé un resumen del archivo ${selectedFilename}.`;
            }

            if (!message && selectedBase64Image) {
                message = "Te envío esta foto para analizar o editar.";
            }

            stopAudio();

            const activeSession = sessions[currentSessionId];
            const userMsgObj = { sender: 'user', text: message };
            if (selectedBase64Image) {
                userMsgObj.image = selectedBase64Image;
            }
            activeSession.messages.push(userMsgObj);

            if (activeSession.title === "Nueva Charla") {
                activeSession.title = message.substring(0, 20) + "...";
            }

            saveSessions();
            appendMessageToUI(message, 'user-message', selectedBase64Image);
            
            const imageToSend = selectedBase64Image;
            const fileToSend = selectedFileB64;
            const filenameToSend = selectedFilename;

            selectedBase64Image = "";
            selectedFileB64 = "";
            selectedFilename = "";
            inputField.value = '';

            const loadingDiv = appendMessageToUI('Pensando...', 'bot-message');

            try {
                const historyPayload = activeSession.messages.map(m => ({
                    role: m.sender === 'user' ? 'user' : 'assistant',
                    content: m.text
                }));

                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: message,
                        location: userLocation,
                        image: imageToSend,
                        file_b64: fileToSend,
                        filename: filenameToSend,
                        session_id: currentSessionId,
                        history: historyPayload
                    })
                });

                const data = await response.json();
                const botReply = data.reply || data.response || "No recibí respuesta.";

                loadingDiv.innerText = botReply;

                const botMsgObj = { sender: 'bot', text: botReply };
                if (data.pdf) {
                    botMsgObj.pdf = data.pdf;
                    renderPdfButton(loadingDiv, data.pdf);
                }

                activeSession.messages.push(botMsgObj);
                saveSessions();

                if (data.audio) {
                    playAudioResponse(data.audio);
                }

            } catch (error) {
                loadingDiv.innerText = "Error de conexión con el servidor.";
                orb.classList.remove('speaking');
            }
        }

        function renderPdfButton(container, pdfB64) {
            const a = document.createElement('a');
            a.href = 'data:application/pdf;base64,' + pdfB64;
            a.download = 'informe_nico_ia.pdf';
            a.className = 'pdf-download-btn';
            a.innerText = '📄 Descargar Informe PDF';
            container.appendChild(document.createElement('br'));
            container.appendChild(a);
        }

        function appendMessageToUI(text, className, imgData = null, pdfB64 = null) {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.innerText = text;

            if (imgData) {
                const imgEl = document.createElement('img');
                imgEl.src = imgData;
                imgEl.className = 'preview-img';
                messageDiv.appendChild(imgEl);
            }

            if (pdfB64) {
                renderPdfButton(messageDiv, pdfB64);
            }

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        function toggleSpeechRecognition() {
            stopAudio();
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Reconocimiento de voz no soportado.");
                return;
            }

            if (isListening) {
                recognition.stop();
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'es-AR';
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('mic-btn').style.color = '#00f2fe';
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('user-input').value = transcript;
                sendMessage();
            };

            recognition.onerror = () => {
                isListening = false;
                document.getElementById('mic-btn').style.color = '#94a3b8';
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('mic-btn').style.color = '#94a3b8';
            };

            recognition.start();
        }

        renderCurrentChat();
        renderSessionsList();
    </script>
</body>
</html>
